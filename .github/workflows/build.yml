name: Build TFM-MENU-4K

on:
  workflow_dispatch:
  push:
    paths:
      - 'main.py'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build EXE
        run: pyinstaller --onefile --windowed --name TFM-MENU-4K main.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: TFM-MENU-4K
          path: dist/TFM-MENU-4K.exe
